<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CineBook cinema banner placeholder</title>
  <desc id="desc">A dark cinematic background with a red glow</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset=".5" stop-color="#12151f"/>
      <stop offset="1" stop-color="#1c0a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".35" r=".55">
      <stop offset="0" stop-color="#e50914" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#e50914" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx=".5" cy="0" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="700" fill="url(#light)"/>
  <g opacity=".16" fill="none" stroke="#ffffff">
    <path d="M0 790 1920 620M0 880 1920 710M0 970 1920 800" stroke-width="2"/>
    <path d="M400 1080V760M960 1080V690M1520 1080V760" stroke-width="2"/>
  </g>
  <text x="140" y="920" fill="#ffffff" fill-opacity=".06" font-family="Arial, sans-serif" font-size="210" font-weight="700" letter-spacing="-10">CINEBOOK</text>
</svg>
